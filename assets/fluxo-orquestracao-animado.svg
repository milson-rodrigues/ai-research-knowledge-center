<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">AI Research Knowledge Center — fluxo de orquestração</title>
<desc id="desc">Fluxo conceitual animado do pedido do usuário até a continuidade, passando pela rota operacional, prompt, agente executor e validação por evidências.</desc>
<defs><style>
.bg{fill:#0A1628}.panel{fill:#11223A;stroke:#374C6B;stroke-width:2}.head{font:700 29px Arial,sans-serif;fill:#F4F7FC}.sub{font:16px Arial,sans-serif;fill:#A6B7CF}.label{font:700 17px Arial,sans-serif;fill:#E9EFF8}.body{font:14px Arial,sans-serif;fill:#A6B7CF}.num{font:700 13px Arial,sans-serif;fill:#A6B7CF}.footer{font:14px Arial,sans-serif;fill:#A6B7CF}.active{fill:none;stroke:#C4A031;stroke-width:4;opacity:.15;animation:focus 6s infinite}.wire{fill:none;stroke:#374E6E;stroke-width:3}.dot{fill:#C4A031}
@keyframes focus{0%,14%{opacity:1;stroke-width:4}16%,100%{opacity:.12;stroke-width:2}}
.s1{animation-delay:0s}.s2{animation-delay:1s}.s3{animation-delay:2s}.s4{animation-delay:3s}.s5{animation-delay:4s}.s6{animation-delay:5s}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8094B3"/></marker></defs>
