e limites</text></g><g id="step-4"><rect class="panel" x="630" y="150" width="160" height="128" rx="15"/><rect class="active s4" x="628" y="148" width="164" height="132" rx="17"/><circle cx="650" cy="170" r="5.5" fill="#CC7047"/><text class="num" x="775" y="174" text-anchor="end">04</text><text class="label" x="710" y="193" text-anchor="middle">Agente</text><text class="label" x="710" y="214" text-anchor="middle">executor</text><text class="body" x="710" y="245" text-anchor="middle">Execução</text><text class="body" x="710" y="263" text-anchor="middle">autorizada</text></g><g id="step-5"><rect class="panel" x="830" y="150" width="160" height="128" rx="15"/><rect class="active s5" x="828" y="148" width="164" height="132" rx="17"/><circle cx="850" cy="170" r="5.5" fill="#C4A031"/><text class="num" x="975" y="174" text-anchor="end">05</text><text class="label" x="910" y="202" text-anchor="middle">Validação</text><text class="body" x="910" y="245" text-anchor="middle">Testes e</text><text class="body" x="910" y="263" text-anchor="middle">evidências</text></g><g id="step-6"><rect class="panel" x="1030" y="150" width="160" height="128" rx="15"/><rect class="active s6" x="1028" y="148" width="164" height="132" rx="17"/><circle cx="1050" cy="170" r="5.5" fill="#20AE89"/><text class="num" x="1175" y="174" text-anchor="end">06</text><text class="label" x="1110" y="202" text-anchor="middle">Continuidade</text><text class="body" x="1110" y="245" text-anchor="middle">Estado e</text><text class="body" x="1110" y="263" text-anchor="middle">próximo bloco</text></g><path class="wire" d="M194 214 H222"/><path d="M215 209 L222 214 L215 219" fill="none" stroke="#8094B3" stroke-width="2"/><path class="wire" d="M394 214 H422"/><path d="M415 209 L422 214 L415 219" fill="none" stroke="#8094B3" stroke-width="2"/><path class="wire" d="M594 214 H622"/><path d="M615 209 L622 214 L615 219" fill="none" stroke="#8094B3" stroke-width="2"/><path class="wire" d="M794 214 H822"/><path d="M815 209 L822 214 L815 219" fill="none" stroke="#8094B3" stroke-width="2"/><path class="wire" d="M994 214 H1022"/><path d="M1015 209 L1022 214 L1015 219" fill="none" stroke="#8094B3" stroke-width="2"/><circle r="5" class="dot" cy="214" cx="110"><animateMotion dur="6s" repeatCount="indefinite" path="M0 0 L1000 0"/></circle><text class="footer" x="600" y="365" text-anchor="middle">O chat orquestra · o agente executa · evidências liberam o próximo bloco</text><text x="600" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C4A031">FLUXO CONCEITUAL · NÃO REPRESENTA UMA EXECUÇÃO EM TEMPO REAL</text></svg>