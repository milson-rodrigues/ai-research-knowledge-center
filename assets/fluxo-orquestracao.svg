<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1810" viewBox="0 0 1450 1810" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de orquestração do AI Research Knowledge Center</title>
<desc id="desc">Diagrama estático com fundo suave mostrando o bootstrap, a rota operacional, as ramificações, a montagem do prompt, a execução, a validação por evidências e a continuidade.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#4C647F"/></marker>
 <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020916" flood-opacity=".12"/></filter>
<linearGradient id="canvasGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0A1628"/><stop offset="100%" stop-color="#0D1B2D"/></linearGradient>
 <pattern id="canvasDotGrid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#263A54" opacity=".48"/></pattern>
 <filter id="flowGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect class="canvas-background" x="1.5" y="1.5" width="1447" height="1807" rx="24" fill="url(#canvasGradient)" stroke="#263A54" stroke-width="3"/>
