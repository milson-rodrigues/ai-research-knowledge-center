 <rect x="1135" y="725" width="280" height="112" rx="14" fill="#211F3D" stroke="#7768AF" stroke-width="2"/><text x="1275" y="760" font-size="18" font-weight="700" fill="#EAF0F8">CATÁLOGO / TEMPLATES</text><text x="1275" y="787" font-size="17" fill="#A9B9D0">Pesquisa, métodos,</text><text x="1275" y="811" font-size="17" fill="#A9B9D0">estado e handoff</text>
</g>
