<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#98AECF"/></marker><filter id="sh" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#142747" flood-opacity=".12"/></filter></defs><rect x="50" y="28" width="1500" height="90" rx="20" fill="#EAF2FF" stroke="#A9BCE0" stroke-width="2"/><text x="800" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142747">Como os documentos se relacionam</text><text x="800" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4F6585">Uma rota, regras claras, execução rastreável e melhoria contínua</text><path d="M350 315 H405" fill="none" stroke="#07886F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M700 315 H760" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1080 295 H1160" fill="none" stroke="#7746D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1080 465 H1120 V365 H1160" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1355 440 V520" fill="none" stroke="#D83D5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1160 585 H1100" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M780 585 H720" fill="none" stroke="#7746D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M400 585 H345" fill="none" stroke="#B98108" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M195 520 V465 H550 V390" fill="none" stroke="#07886F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="50" y="240" width="300" height="150" rx="18" fill="#E6F8F1" stroke="#07886F" stroke-width="3" filter="url(#sh)"/><rect x="64" y="254" width="7" height="122" rx="4" fill="#07886F"/><text x="206" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142747">ROTA DE CONSULTA</text><text x="206" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">Escolhe os arquivos</text><text x="206" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">por situação</text><rect x="405" y="240" width="295" height="150" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="3" filter="url(#sh)"/><rect x="419" y="254" width="7" height="122" rx="4" fill="#2563EB"/><text x="558.5" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142747">GUIA DE PROMPT</text><text x="558.5" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">Preenche o modelo</text><text x="558.5" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">com as regras</text><rect x="760" y="220" width="320" height="150" rx="18" fill="#F2ECFF" stroke="#7746D8" stroke-width="3" filter="url(#sh)"/><rect x="774" y="234" width="7" height="122" rx="4" fill="#7746D8"/><text x="926" y="269" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#142747">REGRAS + PLAYBOOK</text><text x="926" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">Limites, fluxo</text><text x="926" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">e boas práticas</text><rect x="760" y="400" width="320" height="130" rx="18" fill="#FFF2E3" stroke="#D97706" stroke-width="3" filter="url(#sh)"/><rect x="774" y="414" width="7" height="102" rx="4" fill="#D97706"/><text x="926" y="449" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142747">METODOLOGIA</text><text x="926" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">Quando for útil</text><text x="926" y="512" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">à tarefa</text><rect x="1160" y="240" width="390" height="200" rx="18" fill="#FFF0F2" stroke="#D83D5B" stroke-width="3" filter="url(#sh)"/><rect x="1174" y="254" width="7" height="172" rx="4" fill="#D83D5B"/><text x="1361" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142747">PROMPT FINAL</text><text x="1361" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">Escopo autorizado</text><text x="1361" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">e pronto para execução</text><rect x="1160" y="520" width="390" height="130" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="3" filter="url(#sh)"/><rect x="1174" y="534" width="7" height="102" rx="4" fill="#2563EB"/><text x="1361" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142747">AGENTE</text><text x="1361" y="606" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">Executa por blocos</text><rect x="780" y="520" width="320" height="130" rx="18" fill="#F2ECFF" stroke="#7746D8" stroke-width="3" filter="url(#sh)"/><rect x="794" y="534" width="7" height="102" rx="4" fill="#7746D8"/><text x="946" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142747">RELATÓRIO</text><text x="946" y="606" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">Testes e evidências</text><rect x="400" y="520" width="320" height="130" rx="18" fill="#FFF8DD" stroke="#B98108" stroke-width="3" filter="url(#sh)"/><rect x="414" y="534" width="7" height="102" rx="4" fill="#B98108"/><text x="566" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142747">VALIDAÇÃO</text><text x="566" y="606" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">Confere critérios</text><rect x="50" y="520" width="295" height="130" rx="18" fill="#E6F8F1" stroke="#07886F" stroke-width="3" filter="url(#sh)"/><rect x="64" y="534" width="7" height="102" rx="4" fill="#07886F"/><text x="203.5" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142747">CONTINUIDADE</text><text x="203.5" y="606" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4F6585">Estado e decisões</text><rect x="50" y="710" width="1500" height="140" rx="18" fill="#EAF2FF" stroke="#A9BCE0" stroke-width="2"/><circle cx="115" cy="780" r="24" fill="#2563EB"/><text x="115" y="789" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">i</text><text x="830" y="765" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142747">O executor não deve depender de links inacessíveis.</text><text x="830" y="805" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4F6585">O relatório fecha o ciclo com evidências; só então o estado é atualizado.</text></svg>